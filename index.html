<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#24172c"><title>Our First Anniversary ✨</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Noto Sans JP',sans-serif;background:#24172c;color:#fff;overflow:hidden}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}header{text-align:center;margin-top:22px;text-shadow:0 2px 10px #352137}header small{letter-spacing:.3em;color:#ffdae9}h1{font-family:Georgia,serif;font-size:clamp(24px,6vw,39px);margin:6px}#message{padding:13px 20px;background:#2b1729b8;border:1px solid #ffffff44;border-radius:18px;backdrop-filter:blur(8px);text-align:center;font-size:14px;max-width:94%;line-height:1.7}#controls{pointer-events:auto;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:25px}button{border:0;border-radius:30px;padding:13px 20px;background:linear-gradient(120deg,#ff78b0,#ffc2d9);color:#481a38;font-size:15px;font-weight:700;box-shadow:0 6px 25px #180b1855}button:disabled{opacity:.5}#ar{background:#fff;color:#5d254a}#note{font-size:11px;color:#eadde9;text-align:center;margin:0 0 10px}#overlay{position:fixed;inset:0;pointer-events:none}button:focus-visible{outline:3px solid #fff;outline-offset:3px}button:active{transform:scale(.97)}body.in-ar{background:transparent}body.in-ar header{display:none}body.in-ar #message{background:#30192dce}</style></head><body><div id="hud"><header><small>TO MY FAVORITE PERSON</small><h1>Our First Anniversary ♡</h1><div style="font-size:12px">OUR SPECIAL DAY</div></header><div style="margin-top:auto"></div><div id="message" role="status">プレゼントをタップして開けてみてね 🎁</div><div id="controls"><button id="open">🎀 プレゼントを開ける</button><button id="reset">↻ もう一度</button><button id="ar">📷 ARで見る</button></div><p id="note">3DプレビューはPCでも表示できます。ARには対応Android＋Chrome＋HTTPSが必要です。</p></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script><script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();scene.background=new THREE.Color('#24172c');const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.01,100);camera.position.set(0,1.15,2.7);camera.lookAt(0,.22,0);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.xr.enabled=true;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffe9fa,0x7d4760,2.5));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(2,5,3);scene.add(light);
const root=new THREE.Group();scene.add(root);root.position.y=-.12;const pink=new THREE.MeshStandardMaterial({color:'#f58caf',roughness:.35,metalness:.12});const ribbon=new THREE.MeshStandardMaterial({color:'#ffe3a4',metalness:.45,roughness:.3});const inner=new THREE.MeshStandardMaterial({color:'#fbd6e3',roughness:.8});
function cube(parent,w,h,d,mat,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);o.position.set(x,y,z);parent.add(o);return o}
const box=new THREE.Group();root.add(box);cube(box,.65,.43,.65,pink,0,.23,0);cube(box,.12,.437,.663,ribbon,0,.23,0);cube(box,.663,.437,.12,ribbon,0,.23,0);cube(box,.58,.02,.58,inner,0,.44,0);
const lidPivot=new THREE.Group();lidPivot.position.set(0,.46,-.32);box.add(lidPivot);const lid=new THREE.Group();lid.position.set(0,0,.32);lidPivot.add(lid);cube(lid,.72,.11,.72,pink,0,.02,0);cube(lid,.13,.12,.74,ribbon,0,.025,0);cube(lid,.74,.12,.13,ribbon,0,.025,0);
for(let s of [-1,1]){const loop=new THREE.Mesh(new THREE.TorusGeometry(.12,.033,9,28),ribbon);loop.rotation.y=s*.48;loop.position.set(s*.1,.13,0);lid.add(loop)}
const particles=[];const heartShape=new THREE.Shape();heartShape.moveTo(0,.1);heartShape.bezierCurveTo(-.19,.29,-.37,.04,0,-.24);heartShape.bezierCurveTo(.37,.04,.19,.29,0,.1);const heartGeo=new THREE.ShapeGeometry(heartShape);const colors=['#ff8eae','#ffcade','#fff0ad','#e8b7ff'];for(let i=0;i<28;i++){const mat=new THREE.MeshBasicMaterial({color:colors[i%4],side:THREE.DoubleSide,transparent:true,opacity:0});const m=new THREE.Mesh(heartGeo,mat);m.scale.setScalar(.13+Math.random()*.18);m.position.set((Math.random()-.5)*.3,.38,(Math.random()-.5)*.3);root.add(m);particles.push({m,angle:Math.random()*Math.PI*2,speed:.45+Math.random()*.45,offset:Math.random()})}
function label(text,y,size,color){const c=document.createElement('canvas');c.width=1024;c.height=180;const ctx=c.getContext('2d');ctx.clearRect(0,0,1024,180);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=color;ctx.font=`bold ${size}px sans-serif`;ctx.shadowColor='#6b2a55';ctx.shadowBlur=6;ctx.fillText(text,512,90);const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;const obj=new THREE.Mesh(new THREE.PlaneGeometry(1.45,.255),new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide,depthWrite:false}));obj.position.set(0,y,0);obj.visible=false;root.add(obj);return obj}
const text1=label('Happy 1st Anniversary ♡',1.18,62,'#fff1c7');const text2=label('1年間ありがとう',.91,79,'#ffffff');const text3=label('これからもよろしくね ♡',.71,67,'#ffe1ec');
let opening=false,progress=0,placed=false,hitSource=null,refSpace=null,session=null;let ignoreSelectUntil=0;const clock=new THREE.Clock();const msg=document.querySelector('#message');const open=document.querySelector('#open');const reset=document.querySelector('#reset');const ar=document.querySelector('#ar');
function start(){if(renderer.xr.isPresenting&&!placed){msg.textContent='先に床や机をタップしてボックスを置いてね';return}opening=true;msg.textContent='1年間ありがとう。これからもよろしくね ♡'}function restart(){opening=false;progress=0;lidPivot.rotation.x=0;particles.forEach(p=>p.m.material.opacity=0);text1.visible=text2.visible=text3.visible=false;msg.textContent='プレゼントをタップして開けてみてね 🎁'}open.onclick=start;reset.onclick=restart;
const reticle=new THREE.Mesh(new THREE.RingGeometry(.12,.145,36).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:'#ffb5cf',side:THREE.DoubleSide}));reticle.matrixAutoUpdate=false;reticle.visible=false;scene.add(reticle);
async function beginAR(){if(!navigator.xr){msg.textContent='このブラウザはWebXRに対応していません。3Dプレビューをお楽しみください。';return}try{if(!await navigator.xr.isSessionSupported('immersive-ar')){msg.textContent='この端末ではARを開始できません。ARCoreとChromeを確認してね。';return}session=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['hit-test'],optionalFeatures:['dom-overlay'],domOverlay:{root:document.body}});await renderer.xr.setSession(session);document.body.classList.add('in-ar');scene.background=null;root.visible=false;placed=false;restart();msg.textContent='スマホをゆっくり動かし、床や机をタップして設置してね';const viewer=await session.requestReferenceSpace('viewer');hitSource=await session.requestHitTestSource({space:viewer});refSpace=await session.requestReferenceSpace('local');session.addEventListener('select',()=>{if(performance.now()<ignoreSelectUntil)return;if(!placed&&reticle.visible){root.position.setFromMatrixPosition(reticle.matrix);root.visible=true;placed=true;ignoreSelectUntil=performance.now()+650;msg.textContent='プレゼントを開けてみてね 🎁'}else if(placed)start()});session.addEventListener('end',()=>{document.body.classList.remove('in-ar');scene.background=new THREE.Color('#24172c');root.position.set(0,-.12,0);root.visible=true;hitSource=null;refSpace=null;reticle.visible=false;placed=false;restart()})}catch(e){msg.textContent='ARを開始できませんでした: '+e.message}}
ar.onclick=beginAR;
if(!navigator.xr){ar.disabled=true;ar.title='このブラウザはWebXR非対応です'}
const raycaster=new THREE.Raycaster();renderer.domElement.addEventListener('pointerdown',e=>{if(renderer.xr.isPresenting)return;const mouse=new THREE.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);raycaster.setFromCamera(mouse,camera);if(raycaster.intersectObjects(box.children,true).length)start()});
renderer.setAnimationLoop((t,frame)=>{const dt=Math.min(clock.getDelta(),.05);if(opening)progress=Math.min(1,progress+dt*.42);lidPivot.rotation.x=-Math.PI*.76*(1-Math.pow(1-progress,3));const visible=progress>.2;text1.visible=visible&&progress>.45;text2.visible=visible&&progress>.63;text3.visible=visible&&progress>.8;particles.forEach((p,i)=>{p.m.material.opacity=visible?Math.min(.95,(progress-.2)*2):0;const a=p.angle+t*.00035*(i%2?1:-1);const r=.25+p.offset*.55;p.m.position.set(Math.cos(a)*r,.52+progress*(.4+p.offset*.65)+Math.sin(t*.0015+i)*.06,Math.sin(a)*r);p.m.rotation.y=a;p.m.rotation.z=Math.sin(a)*.3});if(renderer.xr.isPresenting&&frame&&hitSource&&!placed){const hits=frame.getHitTestResults(hitSource);if(hits.length){const pose=hits[0].getPose(refSpace);reticle.visible=true;reticle.matrix.fromArray(pose.transform.matrix)}else reticle.visible=false}renderer.render(scene,camera)});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
