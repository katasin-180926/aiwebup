<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Our First Anniversary — AR</title><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script><style>body{margin:0;font-family:system-ui,sans-serif}#panel{position:fixed;top:env(safe-area-inset-top);left:0;right:0;z-index:10;text-align:center;color:#fff;text-shadow:0 2px 8px #000;padding:12px;background:linear-gradient(#3a1d3b99,transparent);pointer-events:none}#controls{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:0;right:0;z-index:10;display:flex;justify-content:center;gap:10px}button{border:0;border-radius:30px;background:#ffb9d9;color:#4e2444;font-weight:700;padding:15px 22px;font-size:15px}#status{font-size:13px;margin-top:5px}</style></head><body><div id="panel"><b>Our First Anniversary ♡</b><div id="status">カメラを記念日マーカーに向けてね</div></div><div id="controls"><button id="open">🎁 プレゼントを開ける</button><button id="reset">↻ もう一度</button></div><a-scene embedded vr-mode-ui="enabled:false" renderer="logarithmicDepthBuffer:true;antialias:true;alpha:true" arjs="sourceType:webcam;debugUIEnabled:false;trackingMethod:best;" loading-screen="enabled:false"><a-marker preset="hiro" id="marker"><a-entity id="gift" position="0 0 0" scale="0.8 0.8 0.8"><a-box position="0 .32 0" width=".8" height=".6" depth=".8" color="#f49abb"></a-box><a-box position="0 .32 0" width=".13" height=".61" depth=".82" color="#ffe1a0"></a-box><a-box position="0 .32 0" width=".82" height=".61" depth=".13" color="#ffe1a0"></a-box><a-entity id="lid" position="0 .68 0"><a-box width=".88" height=".15" depth=".88" color="#f49abb"></a-box><a-box width=".14" height=".16" depth=".9" color="#ffe1a0"></a-box><a-box width=".9" height=".16" depth=".14" color="#ffe1a0"></a-box></a-entity><a-entity id="hearts" visible="false"><a-text value="♥  ♥  ♥" color="#ff4386" align="center" width="2.5" position="0 1.2 0" side="double"></a-text><a-text value="Happy 1st Anniversary" color="#fff3bd" align="center" width="2.8" position="0 1.65 0" side="double"></a-text><a-text value="1年間ありがとう ♡" color="#ffffff" align="center" width="2.4" position="0 1.95 0" side="double"></a-text></a-entity></a-entity></a-marker><a-entity camera></a-entity></a-scene><script>const marker=document.querySelector('#marker'),lid=document.querySelector('#lid'),hearts=document.querySelector('#hearts'),status=document.querySelector('#status');let opened=false;document.querySelector('#open').onclick=()=>{if(!marker.object3D.visible){status.textContent='まずマーカーをカメラに映してね';return}if(opened)return;opened=true;lid.setAttribute('animation','property:position;to:0 1.35 -.35;dur:1400;easing:easeOutCubic');lid.setAttribute('animation__rotate','property:rotation;to:-35 0 0;dur:1400;easing:easeOutCubic');hearts.setAttribute('visible',true);hearts.setAttribute('animation','property:position;from:0 -.35 0;to:0 .15 0;dur:1800;easing:easeOutCubic');status.textContent='1年間ありがとう。これからもよろしくね ♡'};document.querySelector('#reset').onclick=()=>{opened=false;lid.removeAttribute('animation');lid.removeAttribute('animation__rotate');lid.setAttribute('position','0 .68 0');lid.setAttribute('rotation','0 0 0');hearts.removeAttribute('animation');hearts.setAttribute('position','0 0 0');hearts.setAttribute('visible',false);status.textContent='プレゼントを開けてみてね 🎁'};marker.addEventListener('markerFound',()=>{if(!opened)status.textContent='マーカーを認識したよ！プレゼントを開けてね'});marker.addEventListener('markerLost',()=>{status.textContent='マーカーをカメラに向けてね'});</script></body></html>
