
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f9b4cf">
<title>Our First Anniversary ♡ | 2026.11.27</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#fff0f6;color:#632d4d;overflow:hidden}
#ui{position:fixed;inset:0;z-index:10;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 14px) 12px calc(env(safe-area-inset-bottom) + 18px)}
.top{text-align:center;border:1px solid #fff9;border-radius:20px;background:#fffdf2e6;box-shadow:0 6px 30px #67304924;padding:12px 22px;max-width:95%}
.eyebrow{font-size:10px;letter-spacing:.24em;color:#ad6b8b}
.title{font:700 clamp(21px,6vw,30px) Georgia,serif;margin:3px 0;color:#a54574}
.date{font-size:12px;letter-spacing:.17em}
#status{font-size:12px;margin-top:7px;line-height:1.5}
#bottom{text-align:center;pointer-events:auto;width:100%}
#message{display:none;background:#fffdf2f2;color:#8a4165;border-radius:18px;padding:13px 16px;margin:0 auto 10px;max-width:360px;font-size:14px;line-height:1.8;box-shadow:0 5px 20px #7c365029}
#buttons{display:flex;gap:10px;justify-content:center}
button{border:0;border-radius:100px;background:linear-gradient(120deg,#ef76a8,#ffb4cf);padding:14px 20px;color:#602746;font-size:14px;font-weight:750;box-shadow:0 6px 18px #a54a7644}
button.secondary{background:#fff9f0}
#hint{font-size:11px;color:#6f3c58;background:#fffdf2d9;border-radius:10px;padding:6px 10px;display:inline-block;margin-top:9px}
</style>
</head>
<body>
<div id="ui">
  <div class="top">
    <div class="eyebrow">TO MY FAVORITE PERSON</div>
    <div class="title">Our First Anniversary ♡</div>
    <div class="date">2026.11.27</div>
    <div id="status">カメラを記念日マーカーに向けてね ♡</div>
  </div>
  <div id="bottom">
    <div id="message">1年間ありがとう。<br>あなたと過ごした毎日が宝物です。<br>これからもよろしくね ♡</div>
    <div id="buttons">
      <button id="open">🎁 プレゼントを開ける</button>
      <button id="reset" class="secondary">↻ もう一度</button>
    </div>
    <div id="hint">マーカー全体を明るい場所で映してね</div>
  </div>
</div>

<a-scene embedded vr-mode-ui="enabled:false"
  arjs="sourceType:webcam;debugUIEnabled:false;detectionMode:mono;"
  renderer="logarithmicDepthBuffer:true;colorManagement:true;antialias:true"
  device-orientation-permission-ui="enabled:false">

<a-marker preset="hiro" id="marker" smooth="true">
<a-entity id="art" scale=".88 .88 .88">

<a-cylinder position="0 .025 0" radius=".62" height=".045" color="#fff2d8"></a-cylinder>
<a-torus position="0 .065 0" radius=".54" radius-tubular=".013" rotation="-90 0 0" color="#e7b761"></a-torus>

<a-entity id="gift">
  <a-box position="0 .29 0" width=".66" height=".48" depth=".66" color="#f38bad"></a-box>
  <a-box position="0 .29 0" width=".12" height=".485" depth=".675" color="#ffe3a0"></a-box>
  <a-box position="0 .29 0" width=".675" height=".485" depth=".12" color="#ffe3a0"></a-box>
  <a-entity id="lidPivot" position="0 .55 -.34">
    <a-entity position="0 0 .34">
      <a-box width=".73" height=".12" depth=".73" color="#ee83a8"></a-box>
      <a-box width=".14" height=".124" depth=".74" color="#ffe5a3"></a-box>
      <a-box width=".74" height=".124" depth=".14" color="#ffe5a3"></a-box>
      <a-torus position="-.10 .10 0" radius=".115" radius-tubular=".028" rotation="0 35 0" color="#ffe5a3"></a-torus>
      <a-torus position=".10 .10 0" radius=".115" radius-tubular=".028" rotation="0 -35 0" color="#ffe5a3"></a-torus>
    </a-entity>
  </a-entity>
</a-entity>

<a-entity id="couple" position="0 .15 0" visible="false" scale=".01 .01 .01">
  <a-entity position="-.19 0 0">
    <a-sphere position="0 .52 0" radius=".18" color="#f8d5bd"></a-sphere>
    <a-sphere position="0 .64 -.018" radius=".175" scale="1 .72 1" color="#49322e"></a-sphere>
    <a-sphere position="-.057 .535 .155" radius=".013" color="#3b2629"></a-sphere>
    <a-sphere position=".057 .535 .155" radius=".013" color="#3b2629"></a-sphere>
    <a-box position="0 .20 0" width=".25" height=".30" depth=".19" color="#83b9d5"></a-box>
  </a-entity>
  <a-entity position=".19 0 0">
    <a-sphere position="0 .52 0" radius=".18" color="#f7d2bc"></a-sphere>
    <a-sphere position="0 .63 -.035" radius=".19" scale="1 .88 1" color="#694438"></a-sphere>
    <a-sphere position="-.14 .44 -.035" radius=".08" color="#694438"></a-sphere>
    <a-sphere position=".14 .44 -.035" radius=".08" color="#694438"></a-sphere>
    <a-sphere position="-.057 .535 .155" radius=".013" color="#3b2629"></a-sphere>
    <a-sphere position=".057 .535 .155" radius=".013" color="#3b2629"></a-sphere>
    <a-box position="0 .20 0" width=".25" height=".30" depth=".19" color="#f4a8bf"></a-box>
  </a-entity>
  <a-sphere position="0 .31 .15" radius=".055" color="#f6b6c8"></a-sphere>
</a-entity>

<a-entity id="hearts" visible="false"></a-entity>

<a-entity id="message3d" visible="false">
  <a-plane position="0 1.40 0" width="1.25" height=".26" color="#fff4e6" material="opacity:.95;transparent:true;side:double"></a-plane>
  <a-text position="0 1.40 .006" value="1st Anniversary" align="center" color="#9f4670" width="1.9"></a-text>
  <a-text position="0 1.18 .006" value="2026.11.27" align="center" color="#fff7dd" width="1.6"></a-text>
</a-entity>

</a-entity>
</a-marker>
<a-entity camera></a-entity>
</a-scene>

<script>
const $=s=>document.querySelector(s);
const marker=$('#marker');
const status=$('#status');
const msg=$('#message');
const lid=$('#lidPivot');
const couple=$('#couple');
const hearts=$('#hearts');
const text=$('#message3d');

let progress=0;
let opening=false;
let found=false;
let last=0;

for(let i=0;i<18;i++){
  const h=document.createElement('a-entity');
  h.setAttribute('geometry','primitive:torus;radius:.045;radiusTubular:.014;segmentsRadial:6;segmentsTubular:16');
  h.setAttribute('material','color:'+(i%3===0?'#ff7ba6':i%3===1?'#ffdb93':'#e8a7e7'));
  hearts.appendChild(h);
}

function reset(){
  opening=false;
  progress=0;
  lid.object3D.rotation.x=0;
  couple.setAttribute('visible',false);
  couple.object3D.scale.setScalar(.01);
  hearts.setAttribute('visible',false);
  text.setAttribute('visible',false);
  msg.style.display='none';
  status.textContent=found?'プレゼントを開けてみてね 🎁':'カメラを記念日マーカーに向けてね ♡';
}

function openGift(){
  if(!found){
    status.textContent='まずマーカーをカメラに映してね';
    return;
  }
  opening=true;
  status.textContent='Happy 1st Anniversary ♡';
  msg.style.display='block';
}

$('#open').addEventListener('click',openGift);
$('#reset').addEventListener('click',reset);

marker.addEventListener('markerFound',()=>{
  found=true;
  status.textContent=opening?'Happy 1st Anniversary ♡':'プレゼントを開けてみてね 🎁';
});

marker.addEventListener('markerLost',()=>{
  found=false;
  status.textContent='もう一度マーカーを映してね ♡';
});

function animate(t){
  requestAnimationFrame(animate);
  const dt=last?Math.min((t-last)/1000,.06):0;
  last=t;

  if(opening)progress=Math.min(1,progress+dt*.55);

  const p=1-Math.pow(1-progress,3);
  lid.object3D.rotation.x=-p*2.35;

  if(progress>.18){
    hearts.setAttribute('visible',true);
    hearts.children.forEach((h,i)=>{
      const a=i*2.399+t*.00035*(i%2?1:-1);
      const r=.24+(i%6)*.09;
      h.object3D.position.set(
        Math.cos(a)*r,
        .6+(i%5)*.11+Math.sin(t*.002+i)*.055,
        Math.sin(a)*r
      );
      h.object3D.rotation.set(0,a,Math.sin(a)*.3);
      h.object3D.scale.setScalar(Math.min(1,(progress-.18)*3));
    });
  }

  
  if(progress>.35){
    couple.setAttribute('visible',true);
    couple.object3D.visible = true;

    const s=Math.min(1.65,(progress-.35)*4.5);

    couple.object3D.scale.set(s,s,s);
    couple.object3D.position.set(
      0,
      .65 + Math.min(1,progress)*.35,
      .38
    );

    couple.object3D.rotation.y =
      Math.sin(t*.0015)*.12;
  }


  text.setAttribute('visible',progress>.75);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
